[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "nn-probes"
version = "0.1.0"
description = "Online probing of neural network layers during training."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Marcos Oriol" }]
requires-python = ">=3.10"
dependencies = ["torch>=2.1", "numpy>=1.24", "matplotlib>=3.7"]
keywords = ["pytorch", "probing", "representations", "deep-learning", "interpretability"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
sklearn = ["scikit-learn>=1.3"]
dev = ["nn-probes[sklearn]", "pytest>=7", "ruff>=0.4"]

[tool.hatch.build.targets.wheel]
packages = ["src/nnprobes"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF012"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
